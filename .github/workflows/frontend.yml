name: frontend

on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # routeTree.gen.ts is generated by the Start plugin; the build creates it before tsc.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint --deny-warnings
      - run: pnpm lint:tokens
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:verify
      - run: pnpm test:stories
      - run: pnpm build-storybook --quiet
      # Visual changes need a human decision: publish evidence, do not silently bless a new baseline.
      - name: Compare UI with base (observe)
        id: ui
        continue-on-error: true
        env:
          UI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm verify:ui --base "$UI_BASE"
      - name: Publish UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-verification
          path: frontend/.verify/
          if-no-files-found: warn
          retention-days: 7
      - name: Report visual comparison outcome
        if: always()
        env:
          UI_OUTCOME: ${{ steps.ui.outcome }}
        run: |
          echo "UI comparison (observe): $UI_OUTCOME. Review ui-verification artifact; success is not Figma approval." >> "$GITHUB_STEP_SUMMARY"
